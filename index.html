<!doctype html>
<html lang="ko" data-palette="#2a78d6,#eb6834,#1baf7a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법원경매 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  /* 지면 */
  --paper:#f7f4ec; --paper-2:#fffdf8; --rule:#ddd7c8; --rule-strong:#b8b09c;
  --ink:#14130f; --ink-2:#4c4941; --ink-3:#7d786c;
  --seal:#9c2b26;              /* 인장 적색 — 강조는 이 하나로 */
  --seal-wash:#f2e3e0;
  /* 카테고리 (검증 통과: blue/orange/aqua + 중립) */
  --c-land:#2a78d6; --c-bldg:#eb6834; --c-car:#1baf7a; --c-etc:#7d786c;
  /* 4px 그리드 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --serif:"Noto Serif KR",'Apple SD Gothic Neo',serif;
  --sans:"IBM Plex Sans KR",'Apple SD Gothic Neo',system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,input{-webkit-tap-highlight-color:rgba(156,43,38,.15)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{width:1440px;margin:0 auto;padding:0 var(--s7) var(--s8)}

/* ── 마스트헤드 ───────────────────────────── */
.mast{border-bottom:3px double var(--rule-strong);padding:var(--s7) 0 var(--s5);
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:var(--s5)}
.mast h1{font-family:var(--serif);font-weight:900;font-size:64px;line-height:.94;letter-spacing:-.03em;margin:0}
.mast h1 em{font-style:normal;color:var(--seal)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 var(--s3)}
.meta{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2);line-height:1.9}
.meta b{color:var(--ink);font-weight:600}

/* ── KPI 스트립: 크기 대비로 위계 ───────────── */
.kpis{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;border-bottom:1px solid var(--rule)}
.kpi{padding:var(--s5) var(--s5) var(--s5) 0;border-right:1px solid var(--rule)}
.kpi:last-child{border-right:0}
.kpi:not(:first-child){padding-left:var(--s5)}
.kpi dt{font-size:12px;color:var(--ink-3);letter-spacing:.04em;margin:0 0 var(--s2)}
.kpi dd{margin:0;font-family:var(--mono);font-weight:500;font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi.lead dd{font-family:var(--serif);font-weight:700;font-size:60px;line-height:1;letter-spacing:-.04em}
.kpi dd small{font-size:13px;font-family:var(--sans);font-weight:400;color:var(--ink-3);margin-left:6px;letter-spacing:0}

/* ── 본문 비대칭 그리드 ─────────────────────── */
.cols{display:grid;grid-template-columns:1fr 316px;gap:var(--s7);margin-top:var(--s6);align-items:start}

/* 필터 바 — 한 줄 */
.bar{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s4)}
.chip{font:500 13px/1 var(--sans);padding:9px var(--s3);border:1px solid var(--rule-strong);
  background:transparent;color:var(--ink-2);border-radius:2px;cursor:pointer;
  transition:transform .12s var(--ease),background-color .12s var(--ease),color .12s var(--ease)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:baseline}
@media (hover:hover) and (pointer:fine){
  .chip:hover{background:var(--paper-2);color:var(--ink)}
}
.chip:active{transform:translateY(1px)}
.chip:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.sel{font:500 13px/1 var(--sans);padding:9px var(--s2) 9px var(--s3);border:1px solid var(--rule-strong);
  border-radius:2px;background:var(--paper-2);color:var(--ink);cursor:pointer;max-width:190px}
.sel:hover{border-color:var(--ink-3)}
.sel:focus{outline:2px solid var(--seal);outline-offset:-1px}
.sel:disabled{opacity:.45;cursor:not-allowed}
.search{flex:1;min-width:180px;font:400 14px/1 var(--sans);padding:9px var(--s3);
  border:1px solid var(--rule-strong);border-radius:2px;background:var(--paper-2);color:var(--ink)}
.search::placeholder{color:var(--ink-3)}
.search:focus{outline:2px solid var(--seal);outline-offset:-1px;border-color:var(--seal)}
.count{font-family:var(--mono);font-size:12px;color:var(--ink-3);white-space:nowrap}

/* ── 테이블 ───────────────────────────────── */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{font:600 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  text-align:left;padding:0 var(--s3) var(--s2);border-bottom:1.5px solid var(--rule-strong);
  cursor:pointer;user-select:none;white-space:nowrap;transition:color .12s var(--ease)}
@media (hover:hover) and (pointer:fine){
  thead th:hover{color:var(--ink)}
      }
thead th:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
thead th[data-dir]::after{content:"";display:inline-block;margin-left:5px;border:3px solid transparent}
thead th[data-dir="asc"]::after{border-bottom-color:var(--seal);margin-bottom:3px}
thead th[data-dir="desc"]::after{border-top-color:var(--seal);margin-top:3px}
th.num,td.num{text-align:right}
tbody tr{border-bottom:1px solid var(--rule);transition:background-color .1s var(--ease)}
tbody td{padding:var(--s3);vertical-align:top}
.cat{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--sans);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:50%;flex:none}
.case{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.addr{font-weight:500}
.addr b{font-weight:600}
.sub{color:var(--ink-3);font-size:12px;margin-top:2px}
.won{font-family:var(--mono);font-weight:500;font-size:13px}
.rate{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.rate.low{color:var(--seal);font-weight:600}
.fail{display:inline-block;min-width:22px;text-align:center;font-family:var(--mono);font-size:12px;
  padding:2px 5px;border:1px solid var(--rule-strong);border-radius:2px}
.fail.hot{background:var(--seal-wash);border-color:var(--seal);color:var(--seal);font-weight:600}
.date{font-family:var(--mono);font-size:12px}
.open{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;
  border-bottom:1px solid var(--rule-strong)}
.open:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
td a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule-strong)}
td a:hover{color:var(--seal);border-bottom-color:var(--seal)}
td a:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.empty{padding:var(--s8) 0;text-align:center;color:var(--ink-3);font-family:var(--serif);font-size:18px}
.more{margin-top:var(--s4);text-align:center}
.more button{font:500 13px/1 var(--sans);padding:11px var(--s5);background:transparent;
  border:1px solid var(--rule-strong);border-radius:2px;color:var(--ink-2);cursor:pointer;
  transition:transform .12s var(--ease),background-color .12s var(--ease)}
.more button:hover{background:var(--paper-2);color:var(--ink)}
.more button:active{transform:translateY(1px)}
.more button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}

/* ── 사이드: 분포 ──────────────────────────── */
.panel{border-top:1.5px solid var(--rule-strong);padding-top:var(--s4);margin-bottom:var(--s6)}
.panel h2{font-family:var(--serif);font-weight:700;font-size:17px;margin:0 0 var(--s4);letter-spacing:-.01em}
.rows{display:flex;flex-direction:column;gap:var(--s3)}
.row-lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
.row-lab span{color:var(--ink-2)}
.row-lab b{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink)}
.track{height:9px;background:#ece7da;border-radius:2px;overflow:hidden}
.barfill{height:100%;border-radius:0 4px 4px 0;transform-origin:left center;
  animation:grow .26s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){
  /* 움직임만 걷어내고 색·투명도 전환은 남긴다 — 전부 끄면 상태 변화가 뚝 끊긴다 */
  .barfill{animation:none}
  .sheet .panelbox,.lb,.lb img{animation-name:fade;animation-duration:.12s}
  .chip:active,.btn:active,.more button:active,.lb-nav:active{transform:none}
  *{transition-property:opacity,background-color,color,border-color!important}
}
.sheet{position:fixed;inset:0;background:rgba(20,19,15,.55);display:none;z-index:50;
  align-items:stretch;justify-content:flex-end}
.sheet[open]{display:flex}
.sheet .panelbox{width:720px;background:var(--paper);overflow-y:auto;padding:var(--s6) var(--s7) var(--s8);
  box-shadow:-2px 0 24px rgba(0,0,0,.18);animation:slidein .22s var(--ease) both}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;gap:var(--s4);margin:0 0 var(--s2)}
.sheet h3{font-family:var(--serif);font-weight:900;font-size:32px;letter-spacing:-.03em;
  margin:0;flex:1;min-width:0;text-wrap:balance;word-break:keep-all}
.sheet .sub2{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-bottom:var(--s5)}
.sheet-close{flex:none;align-self:flex-start;white-space:nowrap;font:600 13px/1 var(--sans);
  background:transparent;border:1px solid var(--rule-strong);border-radius:2px;padding:9px var(--s3);
  color:var(--ink-2);cursor:pointer;transition:background-color .12s var(--ease)}
.sheet-close:hover{background:var(--paper-2);color:var(--ink)}
.sheet-close:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.dl{display:grid;grid-template-columns:104px 1fr;gap:var(--s2) var(--s4);margin:0 0 var(--s5);
  border-top:1.5px solid var(--rule-strong);padding-top:var(--s3)}
.dl dt{font-size:12px;color:var(--ink-3)}
.dl dd{margin:0;font-size:13px}
.dl dd.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sheet h4{font-family:var(--serif);font-size:15px;font-weight:700;margin:var(--s5) 0 var(--s3);
  border-top:1px solid var(--rule);padding-top:var(--s3)}
.tl{list-style:none;margin:0;padding:0;font-size:13px}
.tl li{display:grid;grid-template-columns:88px 1fr auto;gap:var(--s3);padding:7px 0;
  border-bottom:1px solid var(--rule);align-items:baseline}
.tl .d{font-family:var(--mono);font-size:12px}
.tl .r{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.tl .r.sold{color:var(--seal);font-weight:600}
.notes{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.75}
.notes li{padding:var(--s2) 0;border-bottom:1px solid var(--rule);color:var(--ink-2)}
.notes b{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-bottom:2px}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.pics figure{margin:0}
.pics img{width:100%;height:150px;object-fit:cover;border:1px solid var(--rule);border-radius:2px;
  display:block;cursor:zoom-in;transition:opacity .12s var(--ease)}
.pics figcaption{font-size:10.5px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
.lb{position:fixed;inset:0;background:rgba(12,11,9,.93);z-index:80;display:none;
  align-items:center;justify-content:center;animation:fade .16s var(--ease) both}
.lb[open]{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:2px;
  box-shadow:0 8px 40px rgba(0,0,0,.5);animation:pop .18s var(--ease) both}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.lb-x,.lb-nav{position:absolute;background:rgba(247,244,236,.12);border:1px solid rgba(247,244,236,.28);
  color:#f7f4ec;border-radius:2px;cursor:pointer;font:600 13px/1 var(--sans);
  transition:background-color .12s var(--ease),transform .12s var(--ease)}
.lb-x{top:20px;right:20px;padding:10px 14px}
.lb-nav{top:50%;transform:translateY(-50%);padding:18px 14px;font-size:18px}
.lb-nav.prev{left:16px}
.lb-nav.next{right:16px}
.lb-x:hover,.lb-nav:hover{background:rgba(247,244,236,.24)}
.lb-nav:active{transform:translateY(-50%) scale(.94)}
.lb-x:focus-visible,.lb-nav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.lb-count{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#cfcabd;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em}
@media (max-width:900px){
  .lb img{max-width:100vw;max-height:78vh}
  .lb-nav{padding:14px 10px}
}
.loading{padding:var(--s7) 0;text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:12px}
.act{display:flex;align-items:center;gap:var(--s3);justify-content:flex-end;margin-top:var(--s3)}
.btn{font:600 13px/1 var(--sans);padding:11px var(--s4);border:1px solid var(--seal);border-radius:2px;
  background:var(--seal);color:#fff;cursor:pointer;letter-spacing:.02em;
  transition:transform .12s var(--ease),opacity .12s var(--ease),background-color .12s var(--ease)}
.btn:hover{background:#86231f}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:progress}
.btn .spin{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:-1px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);max-width:340px;text-align:right}
.status.err{color:var(--seal)}
@media (max-width: 900px){
  body{font-size:15px}
  .wrap{width:100%;padding:0 16px 40px}
  .mast{grid-template-columns:1fr;gap:var(--s3);padding:var(--s5) 0 var(--s4)}
  .mast h1{font-size:34px}
  .meta{text-align:left}
  .act{justify-content:flex-start;flex-wrap:wrap}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:var(--s3) var(--s3) var(--s3) 0;border-bottom:1px solid var(--rule)}
  .kpi:nth-child(2n){border-right:0;padding-left:var(--s3)}
  .kpi:not(:first-child){padding-left:var(--s3)}
  .kpi dd{font-size:22px}
  .kpi.lead dd{font-size:34px}
  .cols{grid-template-columns:1fr;gap:var(--s5);margin-top:var(--s4)}
  .bar{gap:var(--s2)}
  .sel{max-width:none;flex:1 1 44%;font-size:16px;min-height:44px;padding:10px var(--s3)}
  .search{flex:1 1 100%;min-width:0;font-size:16px;min-height:44px}
  .chip{flex:0 0 auto;min-height:44px;padding:0 var(--s3);font-size:14px}
  .btn{min-height:44px;font-size:14px}
  .more button{min-height:48px;width:100%;font-size:15px}
  .sheet-close{min-height:44px;padding:11px var(--s4)}
  /* 소재지는 카드에서 가장 중요한 탭 대상이라 손가락이 닿을 여유를 준다 */
  .open{display:block;width:100%;padding:9px 0;min-height:44px;line-height:1.35}
  .addrcell{padding-bottom:var(--s2)}
  thead{display:none}
  table, tbody{display:block}
  tbody tr{display:block;border:1px solid var(--rule);border-radius:3px;background:var(--paper-2);
    padding:var(--s3);margin-bottom:var(--s2)}
  tbody td{display:inline-block;padding:3px 14px 3px 0;text-align:left!important;vertical-align:top}
  tbody td.addrcell{display:block;width:100%;padding-right:0}
  tbody td[data-l]::before{content:attr(data-l);display:block;font-size:10px;color:var(--ink-3);
    letter-spacing:.06em;margin-bottom:1px}
  .open{font-size:16px;font-weight:600}
  .sheet .panelbox{width:100%;padding:var(--s5) var(--s4) var(--s7)}
  .sheet h3{font-size:23px}
  .dl{grid-template-columns:84px 1fr}
  .pics{grid-template-columns:1fr 1fr}
  .empty{padding:var(--s6) 0}
}
.note{font-size:11px;color:var(--ink-3);line-height:1.7;margin-top:var(--s4);
  border-top:1px solid var(--rule);padding-top:var(--s3)}
.note code{font-family:var(--mono);font-size:10.5px;background:#ece7da;padding:1px 4px;border-radius:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <p class="kicker">Court Auction · Republic of Korea</p>
      <h1>법원경매 <em>현황판</em></h1>
    </div>
    <div>
      <div class="meta" id="meta"></div>
      <div class="act">
        <span class="status" id="status"></span>
        <button class="btn" id="collect" type="button">지금 수집</button>
      </div>
    </div>
  </header>

  <dl class="kpis" id="kpis"></dl>

  <div class="cols">
    <main>
      <div class="bar" id="filters">
        <select class="sel" id="sido" aria-label="시도 선택"></select>
        <select class="sel" id="sigu" aria-label="시군구 선택"></select>
        <input class="search" id="q" type="search" placeholder="소재지 · 건물명 · 사건번호 검색" aria-label="검색">
        <span class="count" id="count"></span>
      </div>
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
      <div class="more"><button id="more" type="button">더 보기</button></div>
    </main>

    <aside>
      <section class="panel"><h2>카테고리 분포</h2><div class="rows" id="dist-cat"></div></section>
      <section class="panel"><h2>지역 분포</h2><div class="rows" id="dist-sido"></div></section>
      <section class="panel"><h2>유찰 횟수</h2><div class="rows" id="dist-fail"></div></section>
      <section class="panel"><h2>법원별 상위</h2><div class="rows" id="dist-court"></div></section>
      <p class="note">데이터는 <code>courtauction.py</code> 실행 시점의 스냅샷입니다.
      갱신하려면 수집 후 <code>python3 dashboard.py</code> 를 실행하세요.</p>
    </aside>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="lb-nav prev" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
  <img id="lbImg" alt="">
  <button class="lb-nav next" id="lbNext" type="button" aria-label="다음 사진">›</button>
  <button class="lb-x" id="lbX" type="button">닫기 ESC</button>
  <div class="lb-count" id="lbCount"></div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="물건 상세">
  <div class="panelbox" id="sheetbox"></div>
</div>

<script>
(async () => {

const PROXY_URL = "https://court-auction-detail.marsh-butterfly.workers.dev";
const _r = await fetch('data.json?v=' + Date.now(), {cache: 'no-store'});
if (!_r.ok) throw new Error('데이터를 불러오지 못했습니다 (' + _r.status + ')');
const DATA = await _r.json();
const CAT_COLOR = {"토지":"var(--c-land)","건물":"var(--c-bldg)","차량및운송장비":"var(--c-car)","기타":"var(--c-etc)"};
/* 물건 단위 묶기와 필드 정리는 dashboard.py 가 끝낸 상태로 들어온다. */
const rows = DATA.물건;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won = n => (n||0).toLocaleString("ko-KR");
/* 반올림이 단위 경계를 넘으면 위 단위로 올린다 (99,999,999 를 "10,000만"으로 쓰지 않는다) */
function eok(n){
  if (!n) return "—";
  if (n >= 1e8) {
    const v = +(n / 1e8).toFixed(1);
    if (v >= 10000) return (n / 1e12).toFixed(1) + "조";
    return v.toLocaleString("ko-KR") + "억";
  }
  const m = Math.round(n / 1e4);
  if (m >= 10000) return (n / 1e8).toFixed(1) + "억";
  return m.toLocaleString("ko-KR") + "만";
}
const ymd = s => s && s.length === 8 ? `${s.slice(4,6)}.${s.slice(6,8)}` : "—";

/* 헤더 */
const c = DATA.조건;
meta.innerHTML = `수집 <b>${esc(DATA.수집시각)}</b><br>기일 <b>${esc(c.기간)}</b><br>범위 <b>${esc(scope())}</b>`;
function scope(){
  const names = [...new Set(rows.map(r => r.법원))].filter(Boolean);
  if (names.length === 1) return names[0];
  if (names.length > 1) return `${names.length}개 법원`;
  return c.시도 || "전국";
}

/* KPI */
const total = rows.length;   // 묶은 뒤의 물건 수
const rated = rows.filter(r => r.최저가율);
const avgRate = rated.length ? Math.round(rated.reduce((a,r)=>a+r.최저가율,0)/rated.length) : 0;
const hot = rows.filter(r => r.유찰 >= 2).length;
const sumAppr = rows.reduce((a,r)=>a+(r.감정가||0),0);
kpis.innerHTML = [
  ["수집 물건", `${won(total)}<small>건</small>`, "lead"],
  ["변동 감지", `${won(DATA.변동.length)}<small>건</small>`],
  ["평균 최저가율", `${avgRate}<small>%</small>`],
  ["2회 이상 유찰", `${won(hot)}<small>건</small>`],
  ["감정가 총액", `${eok(sumAppr)}<small>원</small>`],
].map(([k,v,cls]) => `<div class="kpi ${cls||""}"><dt>${k}</dt><dd>${v}</dd></div>`).join("");

/* 카테고리 필터 칩 */
const cats = [...new Set(rows.map(r => r.카테고리))];
const active = new Set(cats);
const catCount = rows.reduce((m,r) => (m[r.카테고리] = (m[r.카테고리]||0)+1, m), {});
filters.insertAdjacentHTML("afterbegin", cats
  .sort((a,b) => catCount[b] - catCount[a])
  .map(k => `<button class="chip" type="button" aria-pressed="true" data-cat="${esc(k)}">
     <i class="dot" style="background:${CAT_COLOR[k]||"var(--c-etc)"}"></i>${esc(k)}
     <b style="font-weight:600;margin-left:5px;opacity:.7">${won(catCount[k])}</b></button>`).join(""));

/* 테이블 */
const COLS = [
  {k:"카테고리", t:"구분", w:"96px"},
  {k:"사건번호", t:"사건", w:"128px"},
  {k:"소재지",   t:"소재지 · 물건"},
  {k:"감정가",   t:"감정가", n:1, w:"104px"},
  {k:"최저가",   t:"최저가", n:1, w:"124px"},
  {k:"유찰",     t:"유찰", n:1, w:"64px"},
  {k:"매각기일", t:"기일", n:1, w:"72px"},
];
let sortKey = "매각기일", sortDir = "asc", shown = 40, view = [];

head.innerHTML = COLS.map(c =>
  `<th tabindex="0" role="button" class="${c.n?"num":""}" data-k="${c.k}" ${c.w?`style="width:${c.w}"`:""}>${c.t}</th>`).join("");

/* ── 지역 선택: 시도를 고르면 그 안의 시군구만 채운다 ── */
const sidoEl = document.getElementById("sido"), siguEl = document.getElementById("sigu");
const byRegion = rows.reduce((m,r) => {
  if (!r.시도) return m;
  (m[r.시도] = m[r.시도] || {})[r.시군구 || "—"] = (m[r.시도]?.[r.시군구 || "—"] || 0) + 1;
  return m;
}, {});
const opt = (v,t,n) => `<option value="${esc(v)}">${esc(t)}${n != null ? ` (${won(n)})` : ""}</option>`;
const sidoTotal = k => Object.values(byRegion[k]).reduce((a,b)=>a+b,0);
sidoEl.innerHTML = opt("", `전체 지역`, rows.length)
  + Object.keys(byRegion).sort((a,b) => sidoTotal(b) - sidoTotal(a)).map(k => opt(k, k, sidoTotal(k))).join("");
function fillSigu(){
  const sd = sidoEl.value;
  siguEl.disabled = !sd;
  siguEl.innerHTML = opt("", sd ? "전체 시군구" : "—")
    + (sd ? Object.entries(byRegion[sd]).sort((a,b) => b[1]-a[1]).map(([k,n]) => opt(k,k,n)).join("") : "");
}
fillSigu();
sidoEl.addEventListener("change", () => { fillSigu(); shown = 40; render(); });
siguEl.addEventListener("change", () => { shown = 40; render(); });

function filtered(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sd = sidoEl.value, sg = siguEl.value;
  return rows.filter(r => active.has(r.카테고리) &&
    (!sd || r.시도 === sd) && (!sg || r.시군구 === sg) &&
    (!q || `${r.소재지} ${r.건물명} ${r.사건번호} ${r.법원}`.toLowerCase().includes(q)))
    .sort((a,b) => {
      const [x,y] = [a[sortKey], b[sortKey]];
      const v = typeof x === "number" ? x - y : String(x).localeCompare(String(y), "ko");
      if (v) return sortDir === "asc" ? v : -v;
      return (a.최저가율 ?? 999) - (b.최저가율 ?? 999);   // 동률이면 저감 큰 물건을 위로
    });
}

function render(){
  const list = filtered();
  count.textContent = `${won(list.length)}건 / 전체 ${won(total)}건`;
  document.querySelectorAll("th").forEach(th =>
    th.dataset.k === sortKey ? th.setAttribute("data-dir", sortDir) : th.removeAttribute("data-dir"));

  view = list.slice(0, shown);
  body.innerHTML = view.map((r,i) => `<tr>
    <td><span class="cat"><i style="background:${CAT_COLOR[r.카테고리]||"var(--c-etc)"}"></i>${esc(r.카테고리)}</span></td>
    <td class="case">${esc(r.사건번호)}${r.물건번호 ? `<span class="sub" style="display:inline"> ·${esc(r.물건번호)}</span>` : ""}
        <div class="sub">${esc(r.법원.replace("지방법원","지법"))}</div></td>
    <td class="addrcell"><div class="addr"><button type="button" class="open" data-i="${i}">${esc(r.소재지)}</button>
        ${r.건물명 ? ` <b>${esc(r.건물명)}</b>` : ""}</div>
        <div class="sub">${esc(r.상세) || "—"}</div></td>
    <td class="num won" data-l="감정가" title="${won(r.감정가)}원">${eok(r.감정가)}</td>
    <td class="num" data-l="최저가"><div class="won" title="${won(r.최저가)}원">${eok(r.최저가)}</div>
        <div class="rate ${r.최저가율 && r.최저가율 < 70 ? "low" : ""}">${r.최저가율 ?? "—"}%</div></td>
    <td class="num" data-l="유찰"><span class="fail ${r.유찰 >= 2 ? "hot" : ""}">${r.유찰}</span></td>
    <td class="num date" data-l="기일">${ymd(r.매각기일)}</td></tr>`).join("")
    || `<tr><td colspan="7" class="empty">조건에 맞는 물건이 없습니다</td></tr>`;
  more.style.display = list.length > shown ? "" : "none";
  more.textContent = `더 보기 (${won(Math.min(40, list.length - shown))}건)`;
}

/* 분포 — 단일 시리즈 막대, 값은 항상 직접 라벨 */
function bars(el, pairs, color){
  const max = Math.max(...pairs.map(p => p[1]), 1);
  el.innerHTML = pairs.map(([k,v],i) => `<div>
    <div class="row-lab"><span>${esc(k)}</span><b>${won(v)}</b></div>
    <div class="track"><div class="barfill" style="width:${(v/max*100).toFixed(1)}%;
      background:${typeof color === "function" ? color(k) : color};
      animation-delay:${i*30}ms"></div></div></div>`).join("");
}
const tally = (arr, f) => Object.entries(arr.reduce((m,r) => (m[f(r)] = (m[f(r)]||0)+1, m), {}));
bars(document.getElementById("dist-cat"),
     tally(rows, r => r.카테고리).sort((a,b) => b[1]-a[1]), k => CAT_COLOR[k] || "var(--c-etc)");
bars(document.getElementById("dist-sido"),
     tally(rows, r => r.시도 || "미상").sort((a,b) => b[1]-a[1]).slice(0,10), "var(--ink-2)");
bars(document.getElementById("dist-fail"),
     tally(rows, r => r.유찰 >= 6 ? "6회 이상" : `${r.유찰}회`)
       .sort((a,b) => a[0].localeCompare(b[0],"ko",{numeric:true})), "var(--ink-2)");
bars(document.getElementById("dist-court"),
     tally(rows, r => `${r.법원.replace("지방법원","지법")} ${r.담당계}`).sort((a,b) => b[1]-a[1]).slice(0,8), "var(--ink-2)");

/* 이벤트 */
filters.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.cat, on = b.getAttribute("aria-pressed") === "true";
  on ? active.delete(k) : active.add(k);
  b.setAttribute("aria-pressed", String(!on));
  shown = 40; render();
});
head.addEventListener("click", e => sortBy(e.target.closest("th")));
head.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(e.target.closest("th")); }
});
function sortBy(th){
  if (!th) return;
  const k = th.dataset.k;
  sortDir = (k === sortKey && sortDir === "asc") ? "desc" : "asc";
  sortKey = k; shown = 40; render();
}
document.getElementById("q").addEventListener("input", () => { shown = 40; render(); });
more.addEventListener("click", () => { shown += 40; render(); });
render();

/* ── 물건 상세 ───────────────────────────────
   법원 사이트는 상세 화면을 URL로 열 수 없다(내부 전환이라 주소가 바뀌지 않고,
   경로를 직접 찍으면 빈 화면이 뜬다). 그래서 상세 API를 서버가 대신 불러 여기서 보여준다. */
const sheet = document.getElementById("sheet"), sheetbox = document.getElementById("sheetbox");
const ROWS = {"01":"매각기일","02":"매각결정기일"};
const RESULT = {"001":"매각","002":"유찰","003":"최고가매각","004":"변경","005":"연기","006":"취하","007":"기각"};
const ITEM = {"00083001":"위치","00083003":"교통","00083006":"이용상태","00083015":"구조","00083002":"주변환경",
  "00083004":"형태·지세","00083005":"도로","00083007":"설비","00083008":"토지이용계획","00083009":"기타"};

/* serve.py 로 열면 /detail, 공유본은 배포된 프록시. 둘 다 없으면 목록이 가진 값만 보여준다. */
const DETAIL_URL = (typeof PROXY_URL !== "undefined" && PROXY_URL)
  ? PROXY_URL
  : (location.protocol.startsWith("http") && !DATA.공유 ? "/detail" : null);

function openSheet(r){
  sheet.setAttribute("open","");
  document.body.style.overflow = "hidden";
  sheetbox.innerHTML = `<div class="sheet-head">
      <h3>${esc(r.소재지)}</h3>
      <button class="sheet-close" type="button" id="x">닫기</button>
    </div>
    <div class="sub2">${esc(r.사건번호)} · 물건 ${esc(r.물건번호 || "1")} · ${esc(r.법원)} ${esc(r.담당계)}</div>
    <div class="loading">상세 조회 중…</div>`;
  document.getElementById("x").addEventListener("click", closeSheet);
  if (!DETAIL_URL) {
    paintLocal(r);          // 조회할 곳이 없으면 목록이 가진 값까지만 보여준다
    return;
  }
  fetch(DETAIL_URL, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({csNo:r.사건번호, cortOfcCd:r.법원코드, dspslGdsSeq:r.물건번호 || "1"})})
    .then(res => res.json())
    .then(d => { if(!d.ok) throw new Error(d.message||"조회 실패"); paint(r, d); })
    .catch(e => {
      paintLocal(r);
      const n = sheetbox.querySelector(".note");
      if (n) n.textContent = `상세를 불러오지 못했습니다 (${e.message}). 아래는 목록에 있는 정보입니다.`;
    });
}

function paintLocal(r){
  const dl = [
    ["감정가", r.감정가 ? won(r.감정가) + "원" : ""],
    ["최저가", won(r.최저가) + "원" + (r.최저가율 ? ` (${r.최저가율}%)` : "")],
    ["유찰", `${r.유찰}회`],
    ["매각기일", ymd8(r.매각기일)],
    ["담당", `${r.법원} ${r.담당계}`],
    ["물건", r.상세],
  ].filter(([,v]) => v && String(v).trim());
  sheetbox.innerHTML = `<div class="sheet-head">
      <h3>${esc(r.소재지)}${r.건물명 ? " " + esc(r.건물명) : ""}</h3>
      <button class="sheet-close" type="button" id="x">닫기</button>
    </div>
    <div class="sub2">${esc(r.사건번호)} · 물건 ${esc(r.물건번호||"1")}</div>
    <dl class="dl">${dl.map(([k,v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("")}</dl>
    <p class="note">사진·기일내역·감정평가 요항은 법원 서버 조회가 필요합니다.
    사건번호로 법원경매정보(courtauction.go.kr)에서 확인하세요.</p>`;
  document.getElementById("x").addEventListener("click", closeSheet);
}

function paint(r, d){
  const b = d.기본, g = d.물건;
  const dl = [
    ["사건명", b.csNm], ["접수일", ymd8(b.csRcptYmd)], ["청구액", b.clmAmt ? won(b.clmAmt)+"원" : ""],
    ["감정평가액", g.aeeEvlAmt ? won(g.aeeEvlAmt)+"원" : ""],
    ["최저매각가", won(r.최저가)+"원" + (r.최저가율 ? ` (${r.최저가율}%)` : "")],
    ["보증금", g.prchDposRate ? `최저가의 ${g.prchDposRate}%` : ""],
    ["매각기일", `${ymd8(g.dspslDxdyYmd)} ${hm(g.fstDspslHm)} · ${g.dspslPlcNm||""}`],
    ["매각결정", `${ymd8(g.dspslDcsnDxdyYmd)} ${hm(g.dspslDcsnHm)} · ${g.dspslDcsnPlcNm||""}`],
    ["담당", `${b.cortAuctnJdbnNm||""} ${b.jdbnTelno||""}`],
  ].filter(([,v]) => v && String(v).trim() && String(v).trim() !== "·");

  const rows = (d.기일||[]).map(x => `<li>
      <span class="d">${ymd8(x.dxdyYmd)}</span>
      <span>${esc(ROWS[x.auctnDxdyKndCd]||"기일")}${x.tsLwsDspslPrc ? ` · ${won(x.tsLwsDspslPrc)}원` : ""}</span>
      <span class="r ${x.auctnDxdyRsltCd==="001"||x.auctnDxdyRsltCd==="003"?"sold":""}">${esc(RESULT[x.auctnDxdyRsltCd]||"예정")}</span>
    </li>`).join("");

  const notes = (d.요항||[]).filter(x => x.내용 && !/^[-\s.]*$/.test(String(x.내용))).map(x =>
    `<li><b>${esc(ITEM[x.코드] || "비고")}</b>${esc(String(x.내용).replace(/&amp;apos;/g,"'"))}</li>`).join("");

  const pics = (d.사진||[]).map((p,i) =>
    `<figure><img src="${p.src}" alt="물건 사진 ${i+1}" loading="lazy"></figure>`).join("");

  sheetbox.innerHTML = `<div class="sheet-head">
      <h3>${esc(r.소재지)}${r.건물명 ? " " + esc(r.건물명) : ""}</h3>
      <button class="sheet-close" type="button" id="x">닫기</button>
    </div>
    <div class="sub2">${esc(r.사건번호)} · 물건 ${esc(r.물건번호||"1")} · ${esc(b.cortOfcNm||r.법원)} ${esc(b.cortAuctnJdbnNm||"")}</div>
    <dl class="dl">${dl.map(([k,v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(v)}</dd>`).join("")}</dl>
    ${pics ? `<h4>사진</h4><div class="pics">${pics}</div>` : ""}
    ${rows ? `<h4>기일 내역</h4><ul class="tl">${rows}</ul>` : ""}
    ${notes ? `<h4>감정평가 요항</h4><ul class="notes">${notes}</ul>` : ""}`;
  document.getElementById("x").addEventListener("click", closeSheet);
}

/* ── 사진 크게 보기 ── */
const lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"),
      lbCount = document.getElementById("lbCount");
let lbList = [], lbAt = 0;

function lbShow(i){
  if (!lbList.length) return;
  lbAt = (i + lbList.length) % lbList.length;      // 처음/끝에서 순환
  lbImg.src = lbList[lbAt];
  lbImg.alt = `물건 사진 ${lbAt + 1}`;
  lbCount.textContent = `${lbAt + 1} / ${lbList.length}`;
  const many = lbList.length > 1;
  document.getElementById("lbPrev").hidden = !many;
  document.getElementById("lbNext").hidden = !many;
}
function lbOpen(i){
  lbList = [...sheetbox.querySelectorAll(".pics img")].map(im => im.src);
  lb.setAttribute("open", "");
  lbShow(i);
}
function lbClose(){ lb.removeAttribute("open"); lbImg.src = ""; }

sheetbox.addEventListener("click", e => {
  const im = e.target.closest(".pics img");
  if (im) lbOpen([...sheetbox.querySelectorAll(".pics img")].indexOf(im));
});
document.getElementById("lbX").addEventListener("click", lbClose);
document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); lbShow(lbAt - 1); });
document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); lbShow(lbAt + 1); });
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbImg) lbClose(); });

const ymd8 = s => s && String(s).length === 8 ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}` : "";
const hm = s => s && String(s).length === 4 ? `${s.slice(0,2)}:${s.slice(2,4)}` : "";
function closeSheet(){ sheet.removeAttribute("open"); document.body.style.overflow = ""; }
body.addEventListener("click", e => {
  const b = e.target.closest(".open"); if (!b) return;
  openSheet(view[+b.dataset.i]);
});
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
document.addEventListener("keydown", e => {
  if (lb.hasAttribute("open")) {
    if (e.key === "Escape") lbClose();
    else if (e.key === "ArrowLeft") lbShow(lbAt - 1);
    else if (e.key === "ArrowRight") lbShow(lbAt + 1);
    return;
  }
  if (e.key === "Escape" && sheet.hasAttribute("open")) closeSheet();
});

/* ── 실시간 수집 ─────────────────────────────
   정적 파일로 열면 수집을 돌릴 주체가 없다. serve.py 로 띄웠을 때만 버튼을 쓴다. */
const btn = document.getElementById("collect"), st = document.getElementById("status");
if (DATA.공유) {
  btn.remove();
  st.textContent = DATA.전체건수 && DATA.전체건수 > rows.length
    ? `전달용 스냅샷 · 전체 ${won(DATA.전체건수)}건 중 기일이 가까운 ${won(rows.length)}건`
    : "전달용 스냅샷";
} else if (!location.protocol.startsWith("http")) {
  btn.disabled = true;
  st.textContent = "python3 serve.py 로 열면 수집 버튼이 동작합니다";
} else {
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    btn.innerHTML = '<i class="spin"></i>수집 중';
    st.className = "status";
    st.textContent = "법원 서버 조회 중… 전국이면 12분 이상 걸립니다";
    try {
      const res = await fetch("/collect", {method:"POST"});
      const d = await res.json();
      if (!d.ok) throw new Error(d.message || `HTTP ${res.status}`);
      st.textContent = `물건 ${won(d.물건)}건 · 변동 ${won(d.변동)}건 — 새로고침합니다`;
      location.reload();
    } catch (e) {
      st.className = "status err";
      st.textContent = `실패: ${e.message}`;
      btn.disabled = false;
      btn.textContent = "다시 시도";
    }
  });
}

})().catch(err => {
  document.getElementById('count').textContent = err.message;
  const b = document.getElementById('body');
  if (b) b.innerHTML = '<tr><td colspan="7" class="empty">' + err.message + '</td></tr>';
});
</script>
</body>
</html>
